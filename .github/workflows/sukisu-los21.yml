name: Build OnePlus-Sm8150-Kernel-LOS21
on:
  push:
    branches:
      - oneplus/LOS_SM8150_14.0
  pull_request:
    branches:
      - oneplus/LOS_SM8150_14.0
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
    steps:
    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Remove unnecessary files
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt install gcc-aarch64-linux-gnu -y
        sudo apt install gcc-arm-linux-gnueabi -y
        sudo apt install clang-14 -y
        sudo apt install binutils make python3 libssl-dev bc xz-utils mkbootimg cpio device-tree-compiler git git-lfs -y
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64 --depth=1
        git clone https://github.com/grm34/proton-clang -b ZenMaxBuilder clang --depth=1
        git clone https://github.com/snowwolf725/AnyKernel3 -b oneplus7 --depth=1
        rm -rf AnyKernel3/.git

    - name: Checkout Android 14 kernel source
      run: |
        rm -rf kernel
        git clone --recurse-submodules https://github.com/snowwolf725/android_kernel_oneplus_sm8150 -b oneplus/LOS_SM8150_14.0 --depth=1 kernel

    - name: Setup LOS 21 and integrate SukiSU Ultra
      run: |
        export KERNEL_DEFCONFIG="lineage_sm8150_defconfig"
        export KERNEL_CMDLINE="ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CONFIG_BUILD_ARM64_DT_OVERLAY=n O=out"
        export PATH=$(pwd)/clang/bin/:$(pwd)/aarch64/bin/:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export LD=ld.lld
        export BRAND_SHOW_FLAG=oneplus
        export TARGET_PRODUCT=msmnile
        cd kernel
        # Clean source tree to satisfy build checks
        make $KERNEL_CMDLINE mrproper
        # Pull latest SukiSU Ultra integration
        cd KernelSU
        git pull https://github.com/SukiSU-Ultra/SukiSU-Ultra.git main
        cd ..
        # Configure bot identity and commit integration
        git config --global user.email "bot@sukisu-ultra.com"
        git config --global user.name "SukiSUBot"
        git add KernelSU
        git commit -m "Integrate SukiSU Ultra (Non-GKI branch)"
        # Generate initial .config from defconfig
        make $KERNEL_CMDLINE CC="ccache clang" lineage_sm8150_defconfig
        # Enable required kernel configs
        scripts/config --file .config --enable KPM
        scripts/config --file .config --enable KALLSYMS
        scripts/config --file .config --enable KALLSYMS_ALL
        # Update .config for any new symbols
        yes "" | make $KERNEL_CMDLINE CC="ccache clang" olddefconfig
        # Build kernel
        make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc --all)
        cp out/arch/arm64/boot/Image ../AnyKernel3
        cd ..

    - name: Create AK3 zip for Android 14
      run: |
        cd AnyKernel3
        zip -r ../OP7-LOS21.zip *
        cd ..

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OP7-LOS21.zip
        name: OnePlus7_kernelsu
        tag_name: test
        body: |
          Device: Oneplus 7/Oneplus 7Pro/Oneplus 7T/Oneplus 7TPro
          Target: LOS21
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
