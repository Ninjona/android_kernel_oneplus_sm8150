name: Build OnePlus-Sm8150-Kernel-LOS21

on:
  workflow_dispatch:
  push:
    branches:
      - oneplus/LOS_SM8150_14.0
  pull_request:
    branches:
      - oneplus/LOS_SM8150_14.0

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      KERNEL_DEFCONFIG: lineage_sm8150_defconfig

    steps:
    # Checkout this repo (for workflow files, if needed)
    - name: Checkout project repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # Fetch the Android 14 kernel source into a subdir
    - name: Checkout Android 14 kernel source
      run: |
        rm -rf kernel
        git clone --recurse-submodules https://github.com/snowwolf725/android_kernel_oneplus_sm8150 \
          -b oneplus/LOS_SM8150_14.0 --depth=1 kernel

    - name: Set up ccache
      uses: hendrikmuhs/ccache-action@v1.2

    - name: Remove unnecessary files
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi git libssl-dev make python3 unzip zip clang llvm lld

    # Clean the kernel directory to remove stale artifacts
    - name: Clean kernel source (mrproper + git clean)
      run: |
        make -C kernel mrproper
        git -C kernel clean -fdx

    # Configure the kernel using an out-of-tree build
    - name: Configure kernel (defconfig)
      run: |
        make O=kernel/out $KERNEL_DEFCONFIG

    - name: Prepare old config
      run: |
        make O=kernel/out olddefconfig

    - name: Verify config
      run: |
        grep "CONFIG_KSU" kernel/out/.config || true

    - name: Build kernel
      run: |
        make O=kernel/out -j$(nproc)

    - name: Package AnyKernel3
      run: |
        cp kernel/out/arch/arm64/boot/Image AnyKernel3/
        cd AnyKernel3
        zip -r ../OP7-LOS21-SU.zip .

    - name: Upload Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OP7-LOS21-SU.zip
        name: OnePlus7-Kernel-SU
        tag_name: su-build-${{ github.run_number }}
        body: |
          Kernel built with SukiSU Ultra (Non-GKI) for OnePlus 7/7 Pro/7T/7T Pro
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
