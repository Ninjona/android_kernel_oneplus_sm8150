name: Build OnePlus-Sm8150-Kernel-LOS21

on:
  workflow_dispatch:
    inputs:
      ZRAM:
        description: 'Enable ZRAM support'
        default: 'false'
      VFS:
        description: 'Enable VFS hook support'
        default: 'false'
  push:
    branches:
      - oneplus/LOS_SM8150_14.0
  pull_request:
    branches:
      - oneplus/LOS_SM8150_14.0

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    # fixed Android & Kernel versions:
    env:
      ANDROID_VERSION: android14
      KERNEL_VERSION: 4.14.355
      ZRAM: ${{ github.event.inputs.ZRAM }}
      VFS:  ${{ github.event.inputs.VFS }}
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: '2G'
      CCACHE_HARDLINK: 'true'

    steps:
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - id: cache-aarch64
        name: Cache AArch64 prebuilt toolchain
        uses: actions/cache@v3
        with:
          path: aarch64/
          key: ${{ runner.os }}-aarch64-prebuilt-${{ hashFiles('aarch64/version.txt') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-prebuilt-

      - id: cache-clang
        name: Cache Clang toolchain
        uses: actions/cache@v3
        with:
          path: clang/
          key: ${{ runner.os }}-clang-ZenMaxBuilder
          restore-keys: |
            ${{ runner.os }}-clang-

      - name: Remove unnecessary files
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install dependencies & AnyKernel3
        run: |
          sudo apt-get update -y
          sudo apt install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang-14 \
            binutils make python3 libssl-dev build-essential bc bison flex unzip ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs
          git clone https://github.com/snowwolf725/AnyKernel3 -b oneplus7 --depth=1
          rm -rf AnyKernel3/.git

      - name: Clone AArch64 prebuilt toolchain
        if: steps.cache-aarch64.outputs.cache-hit != 'true'
        run: |
          rm -rf aarch64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git aarch64 --depth=1
          cd aarch64 && git rev-parse HEAD > version.txt

      - name: Clone Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          rm -rf clang
          git clone https://github.com/grm34/proton-clang -b ZenMaxBuilder clang --depth=1

      - name: Checkout Android 14 kernel source
        run: |
          rm -rf kernel
          git clone https://github.com/Ninjona/android_kernel_oneplus_sm8150 \
            -b oneplus/LOS_SM8150_14.0 --depth=1 kernel

      - name: Integrate SukiSU-Ultra patches
        run: |
          cd kernel

          # 1. Run setup.sh and move KernelSU in place
          curl -SLs https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
            | bash -s susfs-main
          mv KernelSU kernel_platform/KernelSU

          # 2. Compute & export KSU version
          pushd kernel_platform/KernelSU
            REV_COUNT=$(git rev-list --count main)
          popd
          KSU_VERSION=$((REV_COUNT + 10606))
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/^DKSU_VERSION=.*/DKSU_VERSION=${KSU_VERSION}/" \
            kernel_platform/kernel/Makefile

          # 3. Clone SUSFS & extra patches
          mkdir -p patches
          cd patches
          git clone \
            -b gki-${ANDROID_VERSION}-${KERNEL_VERSION} \
            https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          git clone https://github.com/ShirkNeko/SukiSU_patch.git SukiSU_patch

          # 4. Apply core SUSFS, fs helpers, headers
          cd ../kernel_platform/common
          cp ../patches/susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch ./
          cp ../patches/susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../patches/susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          patch -p1 < 50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch || true

          # 5. (opt) ZRAM/LZ4K + LZ4KD
          if [ "${ZRAM}" = "true" ]; then
            cp -r ../patches/SukiSU_patch/other/zram/lz4k/include/linux/* ./include/linux/
            cp -r ../patches/SukiSU_patch/other/zram/lz4k/lib/*           ./lib/
            cp -r ../patches/SukiSU_patch/other/zram/lz4k/crypto/*        ./crypto/
            cp ../patches/SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION}/lz4kd.patch ./
            patch -p1 -F3 < lz4kd.patch || true
          fi

          # 6. Hide stuff
          cp ../../patches/SukiSU_patch/69_hide_stuff.patch ./
          patch -p1 -F3 < 69_hide_stuff.patch

          # 7. (opt) VFS syscall hooks
          if [ "${VFS}" = "true" ]; then
            cp ../../patches/SukiSU_patch/hooks/syscall_hooks.patch ./
            patch -p1 -F3 < syscall_hooks.patch
          fi

          # 8. Enable KSU/SUSFS flags in defconfig
          DEFCONFIG=../kernel_platform/common/arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU=y"   >> "$DEFCONFIG"
          echo "CONFIG_KPM=y"   >> "$DEFCONFIG"

          if [ "${VFS}" = "false" ]; then
            echo "CONFIG_KPROBES=y"            >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_SU=y"   >> "$DEFCONFIG"
          else
            echo "CONFIG_KSU_SUSFS_SUS_SU=n"   >> "$DEFCONFIG"
            echo "CONFIG_KSU_MANUAL_HOOK=y"    >> "$DEFCONFIG"
            cat <<EOF >> "$DEFCONFIG"
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
EOF
          fi

          # 9. Remove check_defconfig guard
          sed -i 's/check_defconfig//' ../kernel_platform/common/build.config.gki

          # 10. Final ZRAM built-in + crypto tweaks
          if [ "${ZRAM}" = "true" ]; then
            if [ "${KERNEL_VERSION}" = "5.10" ]; then
              cat <<EOF >> "$DEFCONFIG"
CONFIG_ZSMALLOC=y
CONFIG_ZRAM=y
CONFIG_CRYPTO_LZO=y
CONFIG_ZRAM_DEF_COMP_LZ4KD=y
CONFIG_MODULE_SIG=n
EOF
            else
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/' "$DEFCONFIG" || true
              sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/'         "$DEFCONFIG" || true
              echo "CONFIG_ZSMALLOC=y" >> "$DEFCONFIG"
              echo "CONFIG_ZRAM=y"      >> "$DEFCONFIG"
            fi

            grep -q "CONFIG_ZSMALLOC=y" "$DEFCONFIG" && \
            grep -q "CONFIG_ZRAM=y"      "$DEFCONFIG" && cat <<EOF >> "$DEFCONFIG"
CONFIG_CRYPTO_LZ4HC=y
CONFIG_CRYPTO_LZ4K=y
CONFIG_CRYPTO_LZ4KD=y
CONFIG_CRYPTO_842=y
CONFIG_ZRAM_WRITEBACK=y
EOF
          fi

      - name: Setup LOS 21
        run: |
          export KERNEL_DEFCONFIG="lineage_sm8150_defconfig"
          export KERNEL_CMDLINE="ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-androidkernel- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 CONFIG_BUILD_ARM64_DT_OVERLAY=n O=out"
          export PATH=$(pwd)/clang/bin/:$(pwd)/aarch64/bin/:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export LD=ld.lld
          export BRAND_SHOW_FLAG=oneplus
          export TARGET_PRODUCT=msmnile
          cd kernel
          make $KERNEL_CMDLINE CC="ccache clang" $KERNEL_DEFCONFIG
          make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc --all)
          cp out/arch/arm64/boot/Image ../AnyKernel3

      - name: Create AK3 zip for Android 14
        run: |
          cd AnyKernel3
          zip -r ./OP7-LOS21.zip *

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AnyKernel3/OP7-LOS21.zip
          name: OnePlus7_SukiSU-v${{ github.run_number }}
          tag_name: v${{ github.run_number }}
          body: |
            Device: Oneplus 7/Oneplus 7Pro/Oneplus 7T/Oneplus 7TPro
            Target: LOS21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
