name: Build OnePlus-Sm8150-Kernel-LOS21
on:
  workflow_dispatch:
 # schedule:
  #  - cron: '0 0 * * *'  # Daily at midnight UTC; adjust as needed
  push:
    branches:
      - oneplus/LOS_SM8150_14.0
  pull_request:
    branches:
      - oneplus/LOS_SM8150_14.0
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      CCACHE_HARDLINK: "true"
      CLANG_COMMIT: "<CLANG_COMMIT_HASH>"  # Replace with the specific commit SHA or tag to lock Clang version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cache ccache
        uses: actions/cache@v3
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('kernel/.config') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Cache AArch64 toolchain
        uses: actions/cache@v3
        with:
          path: aarch64/
          key: ${{ runner.os }}-aarch64-${{ hashFiles('aarch64/version.txt') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-

      - name: Cache Clang toolchain
        uses: actions/cache@v3
        with:
          path: clang/
          key: ${{ runner.os }}-clang-${{ env.CLANG_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-clang-

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang-14 binutils make python3 libssl-dev xz-utils mkbootimg cpio device-tree-compiler git git-lfs

      - name: Download AArch64 cross-compiler
        if: steps.cache-aarch64.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/LineageOS/android_prebuil...linux-x86_aarch64_aarch64-linux-android-4.9 aarch64 --depth=1
          cd aarch64
          echo $(git rev-parse HEAD) > version.txt

      - name: Download Proton Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/grm34/proton-clang -b ZenMaxBuilder clang --depth=1
          cd clang
          git checkout $CLANG_COMMIT
          echo $CLANG_COMMIT > commit.txt

      - name: Remove AnyKernel3 git metadata
        run: rm -rf AnyKernel3/.git

      - name: Checkout kernel source
        run: |
          rm -rf kernel
          git clone --recurse-submodules https://github.com/LineageOS/android_kernel_oneplus_sm8150.git -b oneplus/LOS_SM8150_14.0 --depth=1 kernel

      - name: Configure build environment
        run: |
          export PATH=$PWD/clang/bin:$PWD/aarch64/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64 LD=ld.lld
          export BRAND_SHOW_FLAG=oneplus TARGET_PRODUCT=msmnile

      - name: Build defconfig
        run: |
          cd kernel
          make $KERNEL_CMDLINE CC="ccache clang" $KERNEL_DEFCONFIG

      - name: Compile kernel
        run: |
          cd kernel
          make $KERNEL_CMDLINE CC="ccache clang" -j$(nproc)

      - name: Copy Image to AnyKernel3
        run: cp kernel/out/arch/arm64/boot/Image AnyKernel3

      - name: Package AnyKernel3 zip
        run: |
          cd AnyKernel3
          zip -r ../OP7-LOS21.zip *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: OnePlus7_kernelsu
          files: OP7-LOS21.zip
          body: |
            Device: OnePlus 7/7Pro/7T/7TPro
            Target: LOS21
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
