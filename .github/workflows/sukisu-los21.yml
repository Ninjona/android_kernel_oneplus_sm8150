name: Build OnePlus-Sm8150-Kernel-LOS21

on:
  workflow_dispatch:
    inputs:
      ZRAM:
        description: 'Enable ZRAM support'
        default: 'false'
      VFS:
        description: 'Enable VFS hook support'
        default: 'false'
  push:
    branches:
      - oneplus/LOS_SM8150_14.0
  pull_request:
    branches:
      - oneplus/LOS_SM8150_14.0

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    env:
      ANDROID_VERSION: android14
      KERNEL_VERSION: 4.14.355
      ZRAM: ${{ github.event.inputs.ZRAM }}
      VFS: ${{ github.event.inputs.VFS }}
      CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
      CCACHE_NOHASHDIR: 'true'
      CCACHE_MAXSIZE: '2G'
      CCACHE_HARDLINK: 'true'

    steps:
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - id: cache-aarch64
        name: Cache AArch64 prebuilt toolchain
        uses: actions/cache@v3
        with:
          path: aarch64/
          key: ${{ runner.os }}-aarch64-prebuilt-${{ hashFiles('aarch64/version.txt') }}
          restore-keys: |
            ${{ runner.os }}-aarch64-prebuilt-

      - id: cache-clang
        name: Cache Clang toolchain
        uses: actions/cache@v3
        with:
          path: clang/
          key: ${{ runner.os }}-clang-ZenMaxBuilder
          restore-keys: |
            ${{ runner.os }}-clang-

      - name: Clean up disk space
        run: |
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang-14 \
            binutils make python3 libssl-dev build-essential bc bison flex unzip ca-certificates xz-utils mkbootimg cpio device-tree-compiler git git-lfs

      - name: Setup AnyKernel3
        run: |
          git clone https://github.com/snowwolf725/AnyKernel3 -b oneplus7 --depth=1
          rm -rf AnyKernel3/.git

      - name: Clone AArch64 toolchain (if not cached)
        if: steps.cache-aarch64.outputs.cache-hit != 'true'
        run: |
          rm -rf aarch64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git aarch64 --depth=1
          cd aarch64 && git rev-parse HEAD > version.txt

      - name: Clone Clang toolchain (if not cached)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          rm -rf clang
          git clone https://github.com/grm34/proton-clang -b ZenMaxBuilder clang --depth=1

      - name: Checkout kernel source
        run: |
          rm -rf kernel
          git clone https://github.com/Ninjona/android_kernel_oneplus_sm8150 \
            -b oneplus/LOS_SM8150_14.0 --depth=1 kernel

      - name: Integrate SukiSU patches
        run: |
          cd kernel
          # Install KernelSU
          curl -sSL https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s susfs-main
          
          # Calculate KSU version
          pushd KernelSU >/dev/null
          REV_COUNT=$(git rev-list --count main)
          popd >/dev/null
          KSU_VERSION=$((REV_COUNT + 10606))
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
          
          # Update Makefile version
          sed -i "s/^DKSU_VERSION=.*/DKSU_VERSION=${KSU_VERSION}/" Makefile
          
          # Get patches
          mkdir -p patches
          cd patches
          git clone --single-branch -b kernel-${KERNEL_VERSION%.*} https://gitlab.com/simonpunk/susfs4ksu.git --depth=1
          git clone https://github.com/ShirkNeko/SukiSU_patch.git --depth=1
          cd ..
          
          # Apply SUSFS patch
          patch -p1 < patches/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true
          
          # Copy SUSFS files
          cp -r patches/susfs4ksu/kernel_patches/common/fs/* fs/ 2>/dev/null || :
          cp -r patches/susfs4ksu/kernel_patches/common/include/linux/* include/linux/ 2>/dev/null || :
          
          # Apply optional patches
          if [ "$ZRAM" = "true" ]; then
            cp patches/SukiSU_patch/other/zram/lz4k/include/linux/* include/linux/
            cp patches/SukiSU_patch/other/zram/lz4k/lib/* lib/
            cp patches/SukiSU_patch/other/zram/lz4k/crypto/* crypto/
            patch -p1 -F3 < patches/SukiSU_patch/other/zram/zram_patch/${KERNEL_VERSION}/lz4kd.patch || true
          fi
          
          patch -p1 -F3 < patches/SukiSU_patch/69_hide_stuff.patch
          
          if [ "$VFS" = "true" ]; then
            patch -p1 -F3 < patches/SukiSU_patch/hooks/syscall_hooks.patch
          fi
          
          # Update defconfig
          DEFCONFIG=arch/arm64/configs/lineage_sm8150_defconfig
          echo -e "\n# KernelSU configuration" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KPM=y" >> "$DEFCONFIG"
          
          if [ "$VFS" = "false" ]; then
            echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> "$DEFCONFIG"
          else
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            # ... (other VFS configs remain same)
          fi
          
          if [ "$ZRAM" = "true" ]; then
            echo -e "\n# ZRAM configuration" >> "$DEFCONFIG"
            echo "CONFIG_ZSMALLOC=y" >> "$DEFCONFIG"
            echo "CONFIG_ZRAM=y" >> "$DEFCONFIG"
            # ... (other ZRAM configs remain same)
          fi

      - name: Build kernel
        run: |
          export KERNEL_DEFCONFIG="lineage_sm8150_defconfig"
          export PATH="$(pwd)/clang/bin:$(pwd)/aarch64/bin:$PATH"
          export ARCH=arm64
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-androidkernel-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export LLVM=1
          export LLVM_IAS=1
          
          cd kernel
          make O=out CC="ccache clang" $KERNEL_DEFCONFIG
          make -j$(nproc --all) O=out CC="ccache clang"
          cp out/arch/arm64/boot/Image ../AnyKernel3

      - name: Create flashable zip
        run: |
          cd AnyKernel3
          zip -r9 OP7-LOS21.zip * -x .gitignore

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: AnyKernel3/OP7-LOS21.zip
          tag_name: build-${{ github.run_number }}
          name: SukiSU-v${{ github.run_number }}
          body: |
            Device: OnePlus 7/7 Pro/7T/7T Pro
            Android: LineageOS 21 (Android 14)
            Features:
            - KernelSU ${{ env.KSU_VERSION }}
            - ZRAM: ${{ env.ZRAM }}
            - VFS Hooks: ${{ env.VFS }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
